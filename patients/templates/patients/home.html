{% extends 'patients/base.html' %}
<!DOCTYPE html>
{% load static %}

{% block content %}
<div class="home-container">
    <div class="home-content">
        <h2>Welcome to</h2>
        <h2>PATIENT MANAGEMENT SYSTEM</h2>
        <p class="lead"><i>Comprehensive patient care at your fingertips</i></p>
    </div>
</div>
<div class="home-actions">
        <a href="{% url 'add_patient' %}" class="btn btn-large">Add New Patient</a>
        <a href="{% url 'view_patients' %}" class="btn btn-large">View All Patients</a>
</div>

<div class="home-watermark">
        <img src="{% static 'patients/images/Clinic Logo.png' %}" alt="Clinic Logo">
</div>

<style>
    .home-container {
        display: flex;
        position: fixed;
        top: 20.5%;
        left: 30%;
        min-height: 70vh;
    }
    
    .home-content {
        text-align: center;
        max-width: 600px;
        color: #756537;
    }
    
    .home-content h2 {
        font-size: 2rem;
        line-height: 0.5;
    }
    
    .lead {
        font-size: 1.5rem;
        margin-top: 2rem;
        margin-bottom: 2rem;
    }
    
    .home-actions {
        display: flex;
        gap: 2rem;
        position: fixed;
        top: 90%;
        left: 35%;
    }
    
    .home-watermark {
        position: fixed;
        top: 30.5%;
        left: 51%;
        transform: translateX(-50%);
        opacity: 0.75;
        z-index: -1;
        pointer-events: none;
    }
    .home-watermark img {
        width: 500px;
        height: auto;
    }

    .btn-large {
        padding: 0.75rem 1.5rem;
        font-size: 1.1rem;
    }
</style>
{% endblock %}
