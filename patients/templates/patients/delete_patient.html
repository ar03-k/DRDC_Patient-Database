{% extends 'patients/base.html' %}
{% load static %}

{% block content %}
<div style="display: flex; flex-direction: column; align-items: center; min-height: 100vh; justify-content: flex-start; padding-top: 5px;">
    <div style="text-align: center;">
        <h2 style="margin-bottom: 20px; color: #756537;">Delete Patient</h2>
        <p style="margin-bottom: 30px; font-size: 1.25em; color: #756537;">
            Are you sure you want to delete "{{ patient.name }}"?
        </p>
        
        <form method="post" style="display: inline-block;">
            {% csrf_token %}
            <div style="display: flex; gap: 15px; justify-content: center; margin-top: 300px;">
                <button type="submit" class="btn btn-confirm">
                    Confirm
                </button>
                <a href="{% url 'view_patients' %}" class="btn btn-cancel">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>

{% block watermark %}
<div class="global-watermark">
    <img src="{% static 'patients/images/Clinic Logo.png' %}" alt="Clinic Logo">
</div>
{% endblock %}

<style>
    body {
        margin: 0;
        padding: 0;
        overflow: hidden;
    }

    .btn {
        padding: 12px 30px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        text-decoration: none;
        font-weight: 500;
        text-align: center;
        min-width: 120px;
        font-size: 1em;
        display: inline-block;
        box-sizing: border-box;
        height: 44px; /* Fixed height */
        line-height: 20px; /* Center text vertically */
    }
    
    /* Specific styles for both button types */
    button.btn, a.btn {
        padding: 12px 30px;
        min-width: 120px;
        height: 44px;
    }
    
    .btn-confirm {
        background-color: #756537;
        color: #ffffe3;
        border: 1px solid #756537;
    }
    
    .btn-cancel {
        background-color: #ffffe3;
        color: #756537;
        border: 1px solid #756537;
    }
    
    .global-watermark {
        position: fixed;
        top: 24%;
        left: 50.75%;
        transform: translateX(-50%);
        opacity: 0.25;
        z-index: -1;
        pointer-events: none;
    }
    
    .global-watermark img {
        width: 500px;
        height: auto;
    }
</style>
{% endblock %}
